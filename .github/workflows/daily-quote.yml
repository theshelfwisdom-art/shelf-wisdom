name: Daily Quote

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

jobs:
  pick-quote:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Pick a random quote
        run: python scripts/pick_quote.py

      - name: Install fonts
        run: sudo apt-get update && sudo apt-get install -y fonts-dejavu-core

      - name: Install Python deps
        run: pip install pillow

      - name: Generate video
        run: python scripts/generate_video.py

      - name: Upload video artifact
        uses: actions/upload-artifact@v4
        with:
          name: daily-video
          path: output/daily_video.mp4

      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add current_quote.txt books/daily-wisdom.txt
          git commit -m "Daily quote update" || echo "No changes to commit"
          git push
          
